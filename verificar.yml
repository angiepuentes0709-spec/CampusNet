name: Verificar CampusNet
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build CampusNet.csproj --configuration Release
      - run: dotnet run --project Pruebas/CampusNet.Pruebas.csproj --configuration Release
      - run: dotnet run --project CampusNet.csproj --configuration Release
